<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Update defect | HRMIS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/static/hrmis/css/iom-brand-theme.css">
</head><body class="bg-light"><main class="container py-4"><a href="{% url 'inspections:inspection-detail' defect.inspection_id %}">← Back to inspection</a><h2 class="mt-3">Update corrective action</h2><div class="card border-0 shadow-sm"><div class="card-body"><p><strong>{{ defect.inspection.house.house_id }}</strong> – {{ defect.description }}</p><form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>{% endfor %}<button class="btn btn-primary">Save update</button></form></div></div></main></body></html>
